# Card Factory Configuration
# This file defines how to generate cards from a spreadsheet

# Template selection
# Use {type} to select template based on card type
template:
  pattern: "template/{type}.svg"
  default: "template/hardware.svg"

# Filter: only include rows where the column contains the specified text
# Use | for OR logic: "hardware|gene" matches either
filter:
  column: "type"
  contains: "hardware|evento"

# Bindings: map SVG element IDs to spreadsheet columns
# Supported options:
#   - value: field name(s) to use, supports templates like "{field}" or "{field1}\n\n{field2}"
#   - Transform tags: [uppercase]{field}[/uppercase], [lowercase]{field}[/lowercase]
#   - Inline patterns: ${binding_id} in SVG templates (resolved from bindings)
#   - Markdown-like formatting: *bold*, !heavy! (font-weight:900), _italic_
#   - prefix: text to prepend if value is not empty
#   - attribute: for image bindings, set this to the attribute to modify (e.g., "xlink:href")
#     Images are downloaded, cached locally, and embedded as base64 blobs
bindings:
  - element_id: "name"
    value: "{name}"

  - element_id: "type"
    value: "[uppercase]{type}[/uppercase]"

  - element_id: "subtypes"
    value: "{subtypes}"
    prefix: " - "

  - element_id: "cost"
    value: "{cost}"

  - element_id: "text-body"
    value: "*{text}*\n\n_{flavor}_"

  - element_id: "illustrator"
    value: "{illustrator}"

  # Image binding example - downloads and embeds card illustration
  - element_id: "illustration"
    attribute: "xlink:href"
    value: "https://card-images.netrunnerdb.com/v2/xlarge/{NRDB_ID}.webp|https://card-images.netrunnerdb.com/v2/large/{NRDB_ID}.jpg"

  - element_id: "faction-symbol"
    attribute: "xlink:href"
    value: "template/icons/Faction Glyphs/NSG_[uppercase]{faction}[/uppercase].svg"

# Visibility: show/hide elements based on column values
# Each entry has element_id and optional condition (column==value)
visibility:
  - element_id: "unique-indicator"
    condition: "unique==yes"

  - element_id: "pip1"
    condition: "influence>=1"

  - element_id: "pip2"
    condition: "influence>=2"

  - element_id: "pip3"
    condition: "influence>=3"

  - element_id: "pip4"
    condition: "influence>=4"

  - element_id: "pip5"
    condition: "influence>=5"

# Color schemes: map column values to SVG gradient colors
# lookup_column: column to use for lookup
# schemes: map values (case-insensitive) to color definitions
# Color IDs must match gradient IDs in the SVG template
color_schemes:
  lookup_column: "faction"
  schemes:
    criminal:
      primary-color: "#194c9b"
      light-color: "#75cbff"
      lighter-color: "#d5f1fd"
    neutral:
      primary-color: "#666666"
      light-color: "#999999"
      lighter-color: "#cccccc"

# Substitutions: used to display symbols in place of placeholders
substitutions:
  "[credit]": ""
  "[click]": ""
  "[mu]": ""
  "[recurring credit]": ""

# Output settings
output:
  directory: "export"
  filename_pattern: "{name}.svg"
